<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="#F2A93B" stroke-linecap="round">
  <!-- Crescent moon (top) -->
  <path d="M50 3 a7 7 0 1 0 4.5 12.3 a8.5 8.5 0 1 1 -4.5 -12.3 Z" fill="#F2A93B" stroke="none"/>

  <!-- Radiating rays -->
  <g stroke-width="1.6">
    <!-- top fan -->
    <line x1="50" y1="26" x2="50" y2="18"/>
    <line x1="43.5" y1="27.5" x2="41" y2="20"/>
    <line x1="38" y1="31" x2="33" y2="25"/>
    <line x1="34" y1="36" x2="27" y2="32"/>
    <line x1="56.5" y1="27.5" x2="59" y2="20"/>
    <line x1="62" y1="31" x2="67" y2="25"/>
    <line x1="66" y1="36" x2="73" y2="32"/>
    <!-- bottom fan (short) -->
    <line x1="41" y1="66" x2="37.5" y2="71"/>
    <line x1="50" y1="68" x2="50" y2="74"/>
    <line x1="59" y1="66" x2="62.5" y2="71"/>
  </g>

  <!-- Ray dots -->
  <circle cx="46" cy="17" r="1.1" fill="#F2A93B" stroke="none"/>
  <circle cx="54" cy="17" r="1.1" fill="#F2A93B" stroke="none"/>
  <circle cx="33.5" cy="25.5" r="1.1" fill="#F2A93B" stroke="none"/>
  <circle cx="66.5" cy="25.5" r="1.1" fill="#F2A93B" stroke="none"/>

  <!-- Eye: almond -->
  <path d="M27 51 Q50 37 73 51 Q50 63 27 51 Z" stroke-width="2"/>
  <!-- Upper lashes -->
  <g stroke-width="1.6">
    <line x1="34" y1="45.5" x2="31.5" y2="42.5"/>
    <line x1="42" y1="42" x2="41" y2="38.5"/>
    <line x1="58" y1="42" x2="59" y2="38.5"/>
    <line x1="66" y1="45.5" x2="68.5" y2="42.5"/>
  </g>
  <!-- Iris: little cup / boat -->
  <path d="M45 49 Q50 56 55 49" stroke-width="1.8"/>
  <circle cx="50" cy="49" r="4.2" stroke-width="1.8"/>
  <circle cx="50" cy="50.5" r="1" fill="#F2A93B" stroke="none"/>

  <!-- Side sparkles -->
  <g fill="#F2A93B" stroke="none">
    <path d="M13 50 L14.4 46.9 L17.5 45.6 L14.4 44.3 L13 41.2 L11.6 44.3 L8.5 45.6 L11.6 46.9 Z"/>
    <path d="M87 50 L88.4 46.9 L91.5 45.6 L88.4 44.3 L87 41.2 L85.6 44.3 L82.5 45.6 L85.6 46.9 Z"/>
  </g>

  <!-- Heart (bottom) -->
  <path d="M50 90.5 c-4.5-4-7.5-6.6-7.5-10 a4.2 4.2 0 0 1 7.5-2.6 a4.2 4.2 0 0 1 7.5 2.6 c0 3.4-3 6-7.5 10 Z" stroke-width="1.8"/>
</svg>
